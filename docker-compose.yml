services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    # Fallback para Linux, aunque en Coolify es mejor usar la IP 172.17.0.1 directamente en el DATABASE_URL
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3000
      - PRISMA_CONFIG_LOADER=tsx
    networks:
      - api_network

networks:
  api_network:
    driver: bridge
