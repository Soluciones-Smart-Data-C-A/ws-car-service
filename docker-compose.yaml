services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '3001:3000' 
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - PORT=3000
      - PRISMA_CONFIG_LOADER=tsx
    networks:
      - api_network

networks:
  api_network:
    driver: bridge
